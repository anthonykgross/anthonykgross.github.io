on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Runs on pull requests and pushes: build with the prod config and check the
  # machine-readable views. No deploy rights, no environment, no secrets.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v2
      - name: Config for Production
        run: mv -f _config_prod.yml _config.yml

      - name: Install Dependencies
        run: yarn

      - name: Build the site in the jekyll/builder container
        run: |
          docker run \
          -v ${{ github.workspace }}:/srv/jekyll \
          jekyll/builder:4.2.2 bash -c "chmod -R 777 /srv/jekyll && jekyll build"

      - name: Check machine-readable views
        run: |
          docker run \
          -v ${{ github.workspace }}:/srv/jekyll \
          jekyll/builder:4.2.2 ruby /srv/jekyll/bin/check-machine-views.rb

      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  # Pushes to main only: publish the artifact built and checked above.
  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
